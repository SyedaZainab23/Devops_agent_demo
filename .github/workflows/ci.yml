name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g typescript
      - run: tsc

  notify-devops-agent:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify AWS DevOps Agent
        env:
          WEBHOOK_URL: ${{ secrets.DEVOPS_AGENT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEVOPS_AGENT_WEBHOOK_SECRET }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          INCIDENT_ID="gh-${{ github.run_id }}-$(date +%s)"
          PAYLOAD="{\"eventType\":\"incident\",\"incidentId\":\"${INCIDENT_ID}\",\"action\":\"created\",\"priority\":\"HIGH\",\"title\":\"CI failed: ${{ github.event.head_commit.message }}\",\"description\":\"Workflow ${{ github.workflow }} failed on ${{ github.ref_name }} in ${{ github.repository }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"service\":\"${{ github.repository }}\",\"timestamp\":\"${TIMESTAMP}\"}"
          SIGNATURE=$(echo -n "${TIMESTAMP}:${PAYLOAD}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" -binary | base64)
          echo "Sending to DevOps Agent..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "x-amzn-event-timestamp: ${TIMESTAMP}" \
            -H "x-amzn-event-signature: ${SIGNATURE}" \
            -d "${PAYLOAD}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response: ${BODY}"
